default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # ENV vars take precedence (Docker). Falls back to encrypted credentials (local dev).
  username: <%= ENV["POSTGRES_USER"] || Rails.application.credentials.postgre_username %>
  password: <%= ENV["POSTGRES_PASSWORD"] || Rails.application.credentials.postgre_password %>
  host: <%= ENV["POSTGRES_HOST"] || Rails.application.credentials.postgre_hostname || "localhost" %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5432") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "fixit_hub") %>

test:
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  database: db/test.sqlite3

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "fixit_hub_production") %>
