name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      # SQLite is used for test — no Postgres service needed
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'ci_placeholder_not_used_in_test' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:schema:load

      - name: Run tests
        run: bundle exec rails test

      - name: Run system tests
        run: bundle exec rails test:system
        continue-on-error: true
